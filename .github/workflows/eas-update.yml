name: EAS Update

# Publishes every pushed branch as an over-the-air update on an EAS Update
# branch of the same name, so it can be opened on a phone from the Nudge
# development build (Extensions tab) without a computer.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN secret is not set — skipping EAS Update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.present == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: steps.token.outputs.present == 'true'

      - name: Publish update
        if: steps.token.outputs.present == 'true'
        env:
          # EXPO_PUBLIC_* values are baked into the JS bundle at publish time
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          eas update \
            --branch "$BRANCH" \
            --environment development \
            --message "$(git log -1 --format=%s)" \
            --non-interactive
